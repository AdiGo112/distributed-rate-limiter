services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"] # also used by `npm run test:e2e`

  app:
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      FAIL_OPEN: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info} # set LOG_LEVEL=debug for one log line per request
    ports: ["3000:3000"]
    depends_on: [redis]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # local demo only: open without a login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ratelimiter.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, loki]

  loki:
    image: grafana/loki:3.5.0 # default config: single process, stores on local disk
    ports: ["3100:3100"]

  alloy:
    image: grafana/alloy:v1.10.0
    command: run /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # read container logs
    depends_on: [loki]

  # traffic for the graphs: docker compose run --rm k6
  k6:
    image: grafana/k6:1.1.0
    profiles: [load]
    environment:
      BASE_URL: http://app:3000
    volumes: ["./load:/load:ro"]
    command: run /load/check.k6.js
    depends_on: [app]
