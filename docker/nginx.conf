worker_processes auto;
events { worker_connections 4096; }

http {
  access_log off;

  # "app" resolves to every replica; nginx round-robins across them
  upstream app {
    server app:3000;
    keepalive 256;
    keepalive_timeout 4s; # below Node's 5s keep-alive, so nginx never reuses a socket Node just closed
  }

  server {
    listen 3000;
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
