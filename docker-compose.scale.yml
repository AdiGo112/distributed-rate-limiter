# 3 app replicas behind nginx, same port 3000 as the single-instance stack:
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build
services:
  app:
    ports: !reset []
    deploy:
      replicas: 3

  nginx:
    image: nginx:1.27-alpine
    volumes: ["./docker/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["3000:3000"]
    depends_on: [app]

  k6:
    environment:
      BASE_URL: http://nginx:3000
